# Sveltia CMS — content editor for Keith's K9 Care
# Logs in via GitHub (the repo owner / any collaborator).
# Edits become git commits to main; Cloudflare Pages auto-rebuilds + deploys.

backend:
  name: github
  repo: KeithsK9Care/keithsk9care
  branch: main
  # Auth is handled by our own /cms-auth Pages Function, gated by Cloudflare Access
  # (email One-time PIN). It vends the CMS_GH_TOKEN secret via the CMS auth handshake.
  base_url: https://keithsk9care.co.uk
  auth_endpoint: cms-auth

media_folder: public/assets/photos
public_folder: /assets/photos

site_url: https://keithsk9care.co.uk
display_url: https://keithsk9care.co.uk
logo_url: /assets/logo.png

collections:
  # ─────────────────────────────────────────────────────
  - name: page-copy
    label: "Page copy (editable text on each page)"
    files:
      - file: src/data/copy/home.json
        label: "Homepage"
        name: home
        fields:
          - name: meta
            label: "Page meta (SEO)"
            widget: object
            fields:
              - { name: title,       label: "Page title (SEO)",     widget: string }
              - { name: description, label: "Meta description",     widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            label: "Hero section"
            widget: object
            fields:
              - { name: locationPill,    label: "Location pill",   widget: string }
              - { name: headingHtml,     label: "H1 (HTML)",       widget: text, hint: "Headline. Inner <span class='text-teal-600'>…</span> and <span class='text-coral-500'>…</span> highlight words." }
              - { name: bodyPara1,       label: "Body paragraph 1", widget: text }
              - { name: bodyPara2,       label: "Body paragraph 2", widget: text }
              - { name: ctaPrimary,      label: "Primary CTA label", widget: string }
              - { name: ctaPrimaryHref,  label: "Primary CTA link",  widget: string }
              - { name: ctaSecondary,    label: "Secondary CTA label", widget: string }
              - { name: ctaSecondaryHref, label: "Secondary CTA link", widget: string }
              - { name: ipetBadge,       label: "IPET badge text", widget: string }
          - name: images
            label: "Images"
            widget: object
            hint: "Pick photos for the hero, about teaser and salon grid. Filenames are stubs — Picture wraps WebP+JPG variants at the right size."
            fields:
              - { name: heroPhoto,    label: "Hero photo (filename)", widget: image }
              - { name: heroPhotoAlt, label: "Hero photo alt text", widget: string }
              - { name: aboutPhoto,    label: "About teaser photo", widget: image }
              - { name: aboutPhotoAlt, label: "About teaser photo alt text", widget: string }
              - name: salonPhotos
                label: "Salon photo grid (6 photos)"
                widget: list
                max: 6
                min: 6
                fields:
                  - { name: src, label: "Photo filename", widget: image }
                  - { name: alt, label: "Alt text", widget: string }

          - name: about
            label: "About teaser section"
            widget: object
            fields:
              - { name: eyebrow,    label: Eyebrow,    widget: string }
              - { name: heading,    label: Heading,    widget: string }
              - name: paragraphs
                label: "Body paragraphs"
                widget: list
              - { name: ctaText,    label: "CTA label", widget: string }
              - { name: ctaHref,    label: "CTA link",  widget: string }
          - name: services
            label: "Services section intro"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
              - { name: description, widget: text }
          - name: pricingTeaser
            label: "Pricing teaser intro"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
              - { name: description, widget: text }
              - { name: linkText,    widget: string }
              - { name: linkHref,    widget: string }
          - name: salon
            label: "The salon section"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
              - { name: description, widget: text }
          - name: featuredStory
            label: "Featured story section intro"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
              - { name: description, widget: text }
          - name: areas
            label: "Areas we cover section"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
              - { name: description, widget: text }
              - { name: linkText,    widget: string }
              - { name: linkHref,    widget: string }
          - name: faq
            label: "FAQ section intro"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
          - name: contactCta
            label: "Contact CTA block"
            widget: object
            fields:
              - { name: heading,     widget: string }
              - { name: body,        widget: text }

      # ─── About page ──────────────────────────────────
      - file: src/data/copy/about.json
        label: "About page"
        name: about
        fields:
          - name: meta
            label: "Page meta (SEO)"
            widget: object
            fields:
              - { name: title,       label: "Page title (SEO)",     widget: string }
              - { name: description, label: "Meta description",     widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            label: "Hero section"
            widget: object
            fields:
              - { name: eyebrow,         widget: string }
              - { name: heading,         label: H1, widget: string }
              - { name: body,            widget: text }
              - { name: ctaPrimary,      label: "Primary CTA label", widget: string }
              - { name: ctaPrimaryHref,  label: "Primary CTA link",  widget: string }
              - { name: ctaSecondary,    label: "Secondary CTA label", widget: string }
              - { name: ctaSecondaryHref, label: "Secondary CTA link", widget: string }
              - { name: photo,           label: "Hero photo",       widget: image }
              - { name: photoAlt,        label: "Hero photo alt",   widget: string }
          - name: story
            label: "Story section"
            widget: object
            fields:
              - { name: eyebrow,    widget: string }
              - { name: heading,    widget: string }
              - name: paragraphs
                label: "Body paragraphs"
                widget: list
          - name: whyKeith
            label: "Why Keith — trust pillars"
            widget: object
            fields:
              - { name: eyebrow,    widget: string }
              - { name: heading,    widget: string }
              - { name: description, widget: text }
              - name: pillars
                label: "6 trust pillars"
                widget: list
                max: 6
                min: 6
                fields:
                  - { name: eyebrow, widget: string }
                  - { name: heading, widget: string }
                  - { name: body,    widget: text }
          - name: qualifications
            label: "Qualifications & insurance"
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, widget: string }
              - name: training
                widget: object
                fields:
                  - { name: eyebrow, widget: string }
                  - { name: heading, widget: string }
                  - { name: body,    label: "Body (HTML allowed)", widget: text }
              - name: insurance
                widget: object
                fields:
                  - { name: eyebrow, widget: string }
                  - { name: heading, widget: string }
                  - { name: body,    label: "Body (HTML allowed)", widget: text }
          - name: salon
            label: "Salon section"
            widget: object
            fields:
              - { name: eyebrow,    widget: string }
              - { name: heading,    widget: string }
              - { name: description, widget: text }
              - name: photos
                label: "Salon photos (6)"
                widget: list
                max: 6
                min: 6
                fields:
                  - { name: src, label: "Photo", widget: image }
                  - { name: alt, label: "Alt text", widget: string }
          - name: philosophy
            label: "How we work"
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, widget: string }
              - name: cards
                label: "3 cards"
                widget: list
                max: 3
                min: 3
                fields:
                  - { name: t, label: Title,   widget: string }
                  - { name: b, label: Body,    widget: text }
          - name: contactCta
            label: "Contact CTA"
            widget: object
            fields:
              - { name: heading, widget: string }
              - { name: body,    widget: text }

      # ─── Services index page ─────────────────────────
      - file: src/data/copy/services.json
        label: "Services page (index)"
        name: services_page
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       widget: string }
              - { name: description, widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, widget: string }
              - { name: body,    widget: text }
          - name: overview
            label: "Overview paragraphs (under the service grid)"
            widget: list
            required: false
            hint: "A few paragraphs of overview shown below the services. Each item is one paragraph."
          - name: transparency
            label: "Transparency callout"
            widget: object
            fields:
              - { name: eyebrow,    widget: string }
              - { name: heading,    widget: string }
              - { name: description, widget: text }
              - { name: ctaText,    widget: string }
              - { name: ctaHref,    widget: string }
          - name: contactCta
            widget: object
            fields:
              - { name: heading, widget: string }
              - { name: body,    widget: text }

      # ─── Areas index page ────────────────────────────
      - file: src/data/copy/areas.json
        label: "Areas page (index)"
        name: areas_page
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       widget: string }
              - { name: description, widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, widget: string }
              - { name: body,    widget: text }
          - { name: ctaText, label: "Button text (under the area list)", widget: string }
          - name: overview
            label: "Overview paragraphs (the teal band at the bottom)"
            widget: list
            required: false
            hint: "Paragraphs shown in the teal band below the area list. Each item is one paragraph."

      # ─── Pricing page ────────────────────────────────
      - file: src/data/copy/pricing.json
        label: "Pricing page"
        name: pricing
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       widget: string }
              - { name: description, widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, widget: string }
              - { name: body,    widget: text }
          - name: addOns
            label: "Add-ons & surcharges"
            widget: list
            fields:
              - { name: label, widget: string }
              - { name: from,  label: "From £ (0 = POA)", widget: number, value_type: int }
              - { name: note,  widget: string, required: false }
          - name: addOnsIntro
            widget: object
            fields:
              - { name: eyebrow,    widget: string }
              - { name: heading,    widget: string }
              - { name: description, widget: text }
          - name: howPricingWorks
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, widget: string }
              - name: cards
                widget: list
                fields:
                  - { name: t, label: Title, widget: string }
                  - { name: b, label: Body,  widget: text }
          - name: contactCta
            widget: object
            fields:
              - { name: heading, widget: string }
              - { name: body,    widget: text }

      # ─── FAQ page ────────────────────────────────────
      - file: src/data/copy/faq.json
        label: "FAQ page"
        name: faq
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       widget: string }
              - { name: description, widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, widget: string }
              - { name: body,    widget: text }
          - name: groups
            label: "FAQ section groups"
            widget: list
            fields:
              - { name: eyebrow, widget: string }
              - { name: tag,     label: "Tag in faqs.json (contact, trust, pricing, puppy, nervous, etc.)", widget: string }
              - { name: heading, widget: string }
          - name: generalGroup
            label: "Catch-all group (untagged FAQs)"
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: tag,     widget: string }
              - { name: heading, widget: string }
          - name: contactCta
            widget: object
            fields:
              - { name: heading, widget: string }
              - { name: body,    widget: text }

      # ─── Book page ───────────────────────────────────
      - file: src/data/copy/book.json
        label: "Book page"
        name: book
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       widget: string }
              - { name: description, widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, widget: string }
              - { name: body,    widget: text }
          - name: quickContact
            label: "Top contact cards"
            widget: object
            fields:
              - name: call
                widget: object
                fields:
                  - { name: label,    widget: string }
                  - { name: title,    widget: string }
                  - { name: subtitle, widget: string, required: false }
              - name: whatsapp
                widget: object
                fields:
                  - { name: label,            widget: string }
                  - { name: title,            widget: string }
                  - { name: subtitle,         widget: string }
                  - { name: prefilledMessage, label: "WhatsApp prefilled text", widget: string }
              - name: email
                widget: object
                fields:
                  - { name: label,    widget: string }
                  - { name: title,    widget: string, required: false }
                  - { name: subtitle, widget: string }
          - name: form
            widget: object
            fields:
              - { name: eyebrow,            widget: string }
              - { name: heading,            widget: string }
              - { name: description,        widget: text }
              - { name: submitLabel,        widget: string }
              - { name: submitLoadingLabel, widget: string }
              - { name: privacyNote,        widget: text }
              - { name: reassurance,        label: "Reassurance line (above the button)", widget: text }
          - name: location
            widget: object
            fields:
              - { name: eyebrow,          widget: string }
              - { name: heading,          widget: string }
              - { name: addressLabel,     widget: string }
              - { name: hoursLabel,       widget: string }
              - { name: directionsLabel,  widget: string }
              - { name: addressNote,      widget: text }

      # ─── Thanks page ─────────────────────────────────
      - file: src/data/copy/thanks.json
        label: "Thanks page (post-submit)"
        name: thanks
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       widget: string }
              - { name: description, widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow,           widget: string }
              - { name: heading,           widget: string }
              - { name: body,              widget: text }
              - { name: ctaPrimary,        widget: string }
              - { name: ctaPrimaryHref,    widget: string }
              - { name: ctaSecondary,      widget: string }
              - { name: ctaSecondaryHref,  widget: string }

      # ─── Reviews page ────────────────────────────────
      - file: src/data/copy/reviews.json
        label: "Reviews page"
        name: reviews_page
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       widget: string }
              - { name: description, label: "Meta description", widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow,                       widget: string }
              - { name: body,                          widget: text }
              - { name: headingWithReviewsTemplate,    label: "Heading template (with reviews)", widget: string, hint: "Use {avg}, {n}, {nounOwners} placeholders." }
              - { name: headingWithoutReviews,         label: "Heading (no reviews yet)", widget: string }
              - { name: ctaPrimary,                    widget: string }
              - { name: ctaPrimaryHref,                widget: string }
              - { name: ctaSecondary,                  widget: string }
              - { name: ctaSecondaryHref,              widget: string }
          - name: contactCta
            widget: object
            fields:
              - { name: heading, widget: string }
              - { name: body,    widget: text }

      # ─── Groom Stories index page ────────────────────
      - file: src/data/copy/groom-stories.json
        label: "Groom Stories (index)"
        name: groom_stories_page
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       widget: string }
              - { name: description, widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow,         widget: string }
              - { name: heading,         widget: string }
              - { name: body,            widget: text }
              - { name: ctaPrimary,      widget: string }
              - { name: ctaPrimaryHref,  widget: string }
          - name: contactCta
            widget: object
            fields:
              - { name: heading, widget: string }
              - { name: body,    widget: text }

      # ─── 404 page ────────────────────────────────────
      - file: src/data/copy/404.json
        label: "404 page"
        name: not_found
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       widget: string }
              - { name: description, widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Pick a striking one — this is what shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow,      widget: string }
              - { name: heading,      widget: string }
              - { name: body,         widget: text }
              - { name: callPrompt,   widget: string }
          - name: links
            label: "Suggested links"
            widget: list
            fields:
              - { name: label,   widget: string }
              - { name: href,    widget: string }
              - { name: variant, label: "Style (primary or secondary)", widget: select, options: ["primary","secondary"], default: "secondary" }

      # ─── Privacy page ────────────────────────────────
      - file: src/data/copy/privacy.json
        label: "Privacy policy page"
        name: privacy
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       label: "Page title (SEO)", widget: string }
              - { name: description, label: "Meta description", widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, label: H1, widget: string }
              - { name: body,    label: "Intro line", widget: text }
          - { name: lastUpdated, label: "Last updated (date)", widget: string, hint: "Shown under the heading. Update when you change the policy." }
          - name: sections
            label: "Sections"
            label_singular: "Section"
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { name: heading, label: "Section heading", widget: string }
              - name: intro
                label: "Intro paragraphs (before any list)"
                widget: list
                required: false
                hint: "Each item is a paragraph. <strong>bold</strong> and links allowed, plus auto-fill placeholders {address} {phone} {email} {url}."
              - name: bullets
                label: "Bulleted list (optional)"
                widget: list
                required: false
                hint: "Each item is a bullet point. <strong>bold</strong> and links allowed."
              - name: outro
                label: "Closing paragraphs after the list (optional)"
                widget: list
                required: false

      # ─── Terms page ──────────────────────────────────
      - file: src/data/copy/terms.json
        label: "Terms of service page"
        name: terms
        fields:
          - name: meta
            widget: object
            fields:
              - { name: title,       label: "Page title (SEO)", widget: string }
              - { name: description, label: "Meta description", widget: text }
              - { name: ogImage,     label: "Social share image (og:image)", widget: image, hint: "Picked from photo library. Shows in WhatsApp / Facebook previews." }
          - name: hero
            widget: object
            fields:
              - { name: eyebrow, widget: string }
              - { name: heading, label: H1, widget: string }
              - { name: body,    label: "Intro line", widget: text }
          - { name: lastUpdated, label: "Last updated (date)", widget: string, hint: "Shown under the heading. Update when you change the terms." }
          - name: sections
            label: "Sections"
            label_singular: "Section"
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { name: heading, label: "Section heading", widget: string }
              - name: intro
                label: "Intro paragraphs (before any list)"
                widget: list
                required: false
                hint: "Each item is a paragraph. <strong>bold</strong> and links allowed, plus auto-fill placeholders {address} {phone} {email} {url}."
              - name: bullets
                label: "Bulleted list (optional)"
                widget: list
                required: false
                hint: "Each item is a bullet point. <strong>bold</strong> and links allowed."
              - name: outro
                label: "Closing paragraphs after the list (optional)"
                widget: list
                required: false

  # ─────────────────────────────────────────────────────
  - name: site
    label: "Site settings"
    files:
      - file: src/data/site.json
        label: "Contact, hours, brand"
        name: site
        fields:
          - { name: name,       label: "Business name",         widget: string }
          - { name: shortName,  label: "Short name",            widget: string }
          - { name: tagline,    label: "Tagline",               widget: string }
          - { name: url,        label: "Public URL",            widget: string }
          - { name: owner,      label: "Owner name",            widget: string }
          - { name: qualification,     label: "Qualification (short)",   widget: string }
          - { name: qualificationFull, label: "Qualification (long)",    widget: string }
          - { name: academyName,       label: "Grooming academy name",   widget: string }
          - name: address
            label: "Address"
            widget: object
            fields:
              - { name: street,    label: "Street",      widget: string }
              - { name: locality,  label: "Locality",    widget: string }
              - { name: region,    label: "Region",      widget: string }
              - { name: postcode,  label: "Postcode",    widget: string }
              - { name: country,   label: "Country",     widget: string, default: "GB" }
              - { name: lat,       label: "Latitude",    widget: number, value_type: float }
              - { name: lng,       label: "Longitude",   widget: number, value_type: float }
          - { name: phone,         label: "Phone (display)",          widget: string }
          - { name: phoneIntl,     label: "Phone (E.164, +44...)",    widget: string }
          - { name: whatsappIntl,  label: "WhatsApp (intl, no +)",    widget: string }
          - { name: email,         label: "Email",                    widget: string }
          - { name: facebook,      label: "Facebook URL",             widget: string, required: false }
          - { name: instagram,     label: "Instagram URL",            widget: string, required: false }
          - { name: priceRange,    label: "Price range (£/££/£££)",   widget: string }
          - name: hours
            label: "Opening hours"
            widget: list
            fields:
              - { name: day,   label: Day,   widget: string }
              - { name: open,  label: Open,  widget: string }
              - { name: close, label: Close, widget: string }
          - { name: hoursNote, label: "Hours note", widget: text }
          - { name: surchargesNote, label: "Surcharges note (shown on pricing)", widget: text, hint: "The small-print line about matted-coat and nervous-dog surcharges." }
          - { name: reviewsEyebrow, label: "Reviews strip eyebrow", widget: string, hint: "The small heading shown above the review cards." }
          - name: serviceArea
            label: "Service area (towns/villages)"
            widget: list
          - name: trustPoints
            label: "Trust points (hero strip)"
            widget: list

  # ─────────────────────────────────────────────────────
  - name: services
    label: "Services (full grooming menu)"
    label_singular: "Service"
    description: "Each grooming service is its own entry. Add one with 'New Service', or click a service to edit it."
    folder: src/data/services
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{fields.order}}. {{fields.name}}"
    sortable_fields: [order, name, fromPrice]
    fields:
      - { name: order,          label: "Display order", widget: number, value_type: int, hint: "Lower numbers show first across the site. 1, 2, 3…" }
      - { name: slug,           label: "URL slug", widget: string, hint: "Lower-case with hyphens — becomes /services/<slug>/. Don't change it on an existing service or its links break." }
      - { name: name,           label: "Service name", widget: string }
      - { name: summary,        label: "Summary (card text)", widget: text }
      - { name: fromPrice,      label: "From £ (number)", widget: number, value_type: int }
      - { name: duration,       label: Duration, widget: string }
      - name: tiers
        label: "Price tiers"
        widget: list
        fields:
          - { name: label, widget: string }
          - { name: from,  widget: number, value_type: int }
          - { name: note,  widget: string, required: false }
      - name: includes
        label: "What's included"
        widget: list
      - { name: heroPhoto,        label: "Hero photo", widget: image, required: false, hint: "Picked from photo library. Shows at the top of the service page + as social share image." }
      - { name: heroPhotoAlt,     label: "Hero photo alt text", widget: string, required: false, hint: "Short description of what's in the photo (for accessibility + Google)." }
      - { name: metaDescription,  label: "Meta description (SEO)", widget: text, required: false }
      - name: body
        label: "Body paragraphs"
        widget: list
        required: false
      - name: faqs
        label: "Service-specific FAQs"
        widget: list
        required: false
        fields:
          - { name: q, widget: string }
          - { name: a, widget: text }
      - name: relatedSlugs
        label: "Related service slugs"
        widget: list
        required: false
      - name: breedExamples
        label: "Breed examples (for /pricing/)"
        widget: list
        required: false
        fields:
          - { name: size, label: "Tier label", widget: string }
          - { name: from, label: "From £",    widget: number, value_type: int }
          - name: breeds
            label: "Breeds in this tier"
            widget: list

  # ─────────────────────────────────────────────────────
  - name: areas
    label: "Areas covered"
    label_singular: "Area"
    description: "Each local area page is its own entry. Add one with 'New Area', or click an area to edit it."
    folder: src/data/areas
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: name
    summary: "{{fields.order}}. {{fields.name}}"
    sortable_fields: [order, name, distanceMiles]
    fields:
      - { name: order,           label: "Display order", widget: number, value_type: int, hint: "Lower numbers show first. 1, 2, 3…" }
      - { name: slug,            label: "URL slug", widget: string, hint: "Lower-case with hyphens — becomes /areas/<slug>/. Don't change it on an existing area or its links break." }
      - { name: name,            label: "Area name", widget: string }
      - { name: postcodePrefix,  label: "Postcode prefix", widget: string }
      - { name: distanceMiles,   label: "Distance (miles)", widget: number, value_type: float }
      - { name: driveMinutes,    label: "Drive time (minutes)", widget: number, value_type: int }
      - name: landmarks
        label: "Local landmarks"
        widget: list
      - { name: blurb, label: "Short blurb (used as fallback intro)", widget: text }
      - { name: metaDescription, label: "Meta description (SEO)", widget: text, required: false }
      - { name: lead, label: "Intro line (under the heading)", widget: text, required: false }
      - { name: heroPhoto, label: "Hero / social image", widget: image, required: false, hint: "Optional. Defaults to a stock photo if left blank." }
      - name: body
        label: "Body paragraphs"
        widget: list
        required: false
        hint: "The main page content for this area — aim for a few genuinely local paragraphs (landmarks, drive time, who we serve there)."
      - name: faqs
        label: "Area FAQs"
        widget: list
        required: false
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }

  # ─────────────────────────────────────────────────────
  - name: faqs
    label: "FAQs"
    label_singular: "FAQ"
    description: "Each FAQ is its own entry. Add one with 'New FAQ', or click a question to edit it."
    folder: src/data/faqs
    format: json
    extension: json
    create: true
    slug: "{{fields.q}}"
    identifier_field: q
    summary: "{{fields.order}}. {{fields.q}}"
    sortable_fields: [order, q]
    fields:
      - { name: order, label: "Display order", widget: number, value_type: int, hint: "Lower numbers show first. 1, 2, 3…" }
      - { name: q, label: Question, widget: string }
      - { name: a, label: Answer,   widget: text }
      - name: tags
        label: "Tags"
        widget: list
        hint: "Which sections this FAQ appears in — e.g. home, puppy, nervous, pricing, contact, trust, about. 'home' shows it on the homepage FAQ block."

  # ─────────────────────────────────────────────────────
  - name: reviews
    label: "Reviews"
    label_singular: "Review"
    description: "Each customer review is its own entry. Add one with 'New Review'. Only add real reviews from real customers, with their permission."
    folder: src/data/reviews
    format: json
    extension: json
    create: true
    slug: "{{fields.author}}-{{fields.dog}}"
    identifier_field: author
    summary: "{{fields.author}} — {{fields.dog}}"
    sortable_fields: [date, author, rating]
    fields:
      - { name: author,    label: "Customer name",     widget: string,  hint: "e.g. Sarah M." }
      - { name: location,  label: "Where they live",   widget: string,  required: false, hint: "e.g. Newmillerdam" }
      - { name: dog,       label: "Dog's name + breed", widget: string, required: false, hint: "e.g. Bella (cockapoo)" }
      - { name: service,   label: "Service",           widget: select, required: false,
          options: ["Full Groom","Puppy First Groom","Bath & Tidy","Nail Trim, Ear Clean & Tidy","De-matting & Coat Recovery","Hand Stripping"] }
      - { name: rating,    label: "Stars (1–5)",       widget: number,  min: 1, max: 5, value_type: int, default: 5 }
      - { name: date,      label: "Date",              widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: body,      label: "Review",            widget: text,    hint: "What the customer said." }
      - { name: featured,  label: "Show on every page?", widget: boolean, default: false, hint: "Featured reviews appear in the strip under every page hero. Pick your 3 best." }

  # ─────────────────────────────────────────────────────
  - name: groom-stories
    label: "Groom Stories"
    label_singular: "Groom Story"
    description: "Each before-and-after story is its own entry. Add one with 'New Groom Story'."
    folder: src/data/groom-stories
    format: json
    extension: json
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{fields.dog}} — {{fields.service}}"
    sortable_fields: [date, dog]
    fields:
      - { name: title,       label: "Story title",       widget: string,  hint: "Short, descriptive. e.g. 'Milo's coat recovery after a wet summer'" }
      - { name: description, label: "Story description", widget: text,    hint: "1–2 sentences shown under the title on cards and in the hero." }
      - { name: dog,         label: "Dog's name",        widget: string,  hint: "e.g. Milo" }
      - { name: breed,       label: "Breed & age",       widget: string,  hint: "e.g. Cockapoo, 3 years" }
      - { name: service,     label: "Service",           widget: select,
          options: ["Full Groom","Puppy First Groom","Bath & Tidy","Nail Trim, Ear Clean & Tidy","De-matting & Coat Recovery","Hand Stripping","De-matting & Full Groom"] }
      - { name: area,        label: "Where they live",   widget: string,  hint: "e.g. Newmillerdam" }
      - { name: date,        label: "Date of groom",     widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: summary,     label: "Short preview",     widget: text,    hint: "1–2 sentences shown on the card." }
      - { name: story,       label: "Full story",        widget: markdown, hint: "Write the story in paragraphs. Leave a blank line between paragraphs." }
      - { name: beforePhoto, label: "Before photo", widget: image, required: false, hint: "Shown at the top of the story (left). Pick from existing photo library." }
      - { name: afterPhoto,  label: "After photo",  widget: image, required: false, hint: "Shown at the top of the story (right) + as the card thumbnail on the index page." }
      - { name: featured,    label: "Highlight on homepage?", widget: boolean, default: false }
      - { name: slug,        label: "URL ending",        widget: string,  hint: "Short, lower-case, hyphen-separated. e.g. milo-after-summer" }
