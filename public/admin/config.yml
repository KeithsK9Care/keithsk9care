# Sveltia CMS — content editor for Keith's K9 Care
# Logs in via GitHub (the repo owner / any collaborator).
# Edits become git commits to main; Cloudflare Pages auto-rebuilds + deploys.

backend:
  name: github
  repo: KeithsK9Care/keithsk9care
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: public/assets/photos
public_folder: /assets/photos

site_url: https://keithsk9care.co.uk
display_url: https://keithsk9care.co.uk
logo_url: /assets/logo.png

collections:
  # ─────────────────────────────────────────────────────
  - name: page-copy
    label: "Page copy (editable text on each page)"
    files:
      - file: src/data/copy/home.json
        label: "Homepage"
        name: home
        fields:
          - name: hero
            label: "Hero section"
            widget: object
            fields:
              - { name: locationPill,    label: "Location pill",   widget: string }
              - { name: headingHtml,     label: "H1 (HTML)",       widget: text, hint: "Headline. Inner <span class='text-teal-600'>…</span> and <span class='text-coral-500'>…</span> highlight words." }
              - { name: bodyPara1,       label: "Body paragraph 1", widget: text }
              - { name: bodyPara2,       label: "Body paragraph 2", widget: text }
              - { name: ctaPrimary,      label: "Primary CTA label", widget: string }
              - { name: ctaPrimaryHref,  label: "Primary CTA link",  widget: string }
              - { name: ctaSecondary,    label: "Secondary CTA label", widget: string }
              - { name: ctaSecondaryHref, label: "Secondary CTA link", widget: string }
              - { name: ipetBadge,       label: "IPET badge text", widget: string }
          - name: images
            label: "Images"
            widget: object
            hint: "Pick photos for the hero, about teaser and salon grid. Filenames are stubs — Picture wraps WebP+JPG variants at the right size."
            fields:
              - { name: heroPhoto,    label: "Hero photo (filename)", widget: select, options: ["black-poodle-after-groom","black-poodle-side","border-terrier-after-groom","cockapoo-after-groom","cockapoo-portrait","cocker-spaniel-after-groom","golden-puppy-woodland-1","golden-puppy-woodland-2","golden-puppy-woodland-3","golden-puppy-woodland-4","golden-retriever-puppy-newmillerdam-1","golden-retriever-puppy-newmillerdam-2","keith-with-border-terrier","keith-with-chihuahua","keith-with-cockapoo","keith-with-cocker-spaniel","keith-with-grey-schnauzer"] }
              - { name: heroPhotoAlt, label: "Hero photo alt text", widget: string }
              - { name: aboutPhoto,    label: "About teaser photo", widget: select, options: ["black-poodle-after-groom","black-poodle-side","border-terrier-after-groom","cockapoo-after-groom","cockapoo-portrait","cocker-spaniel-after-groom","golden-puppy-woodland-1","golden-puppy-woodland-2","golden-puppy-woodland-3","golden-puppy-woodland-4","golden-retriever-puppy-newmillerdam-1","golden-retriever-puppy-newmillerdam-2","keith-with-border-terrier","keith-with-chihuahua","keith-with-cockapoo","keith-with-cocker-spaniel","keith-with-grey-schnauzer"] }
              - { name: aboutPhotoAlt, label: "About teaser photo alt text", widget: string }
              - name: salonPhotos
                label: "Salon photo grid (6 photos)"
                widget: list
                max: 6
                min: 6
                fields:
                  - { name: src, label: "Photo filename", widget: select, options: ["black-poodle-after-groom","black-poodle-side","border-terrier-after-groom","cockapoo-after-groom","cockapoo-portrait","cocker-spaniel-after-groom","golden-puppy-woodland-1","golden-puppy-woodland-2","golden-puppy-woodland-3","golden-puppy-woodland-4","golden-retriever-puppy-newmillerdam-1","golden-retriever-puppy-newmillerdam-2","keith-with-border-terrier","keith-with-chihuahua","keith-with-cockapoo","keith-with-cocker-spaniel","keith-with-grey-schnauzer"] }
                  - { name: alt, label: "Alt text", widget: string }

          - name: about
            label: "About teaser section"
            widget: object
            fields:
              - { name: eyebrow,    label: Eyebrow,    widget: string }
              - { name: heading,    label: Heading,    widget: string }
              - name: paragraphs
                label: "Body paragraphs"
                widget: list
              - { name: ctaText,    label: "CTA label", widget: string }
              - { name: ctaHref,    label: "CTA link",  widget: string }
          - name: services
            label: "Services section intro"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
              - { name: description, widget: text }
          - name: pricingTeaser
            label: "Pricing teaser intro"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
              - { name: description, widget: text }
              - { name: linkText,    widget: string }
              - { name: linkHref,    widget: string }
          - name: salon
            label: "The salon section"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
              - { name: description, widget: text }
          - name: areas
            label: "Areas we cover section"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
              - { name: description, widget: text }
              - { name: linkText,    widget: string }
              - { name: linkHref,    widget: string }
          - name: faq
            label: "FAQ section intro"
            widget: object
            fields:
              - { name: eyebrow,     widget: string }
              - { name: heading,     widget: string }
          - name: contactCta
            label: "Contact CTA block"
            widget: object
            fields:
              - { name: heading,     widget: string }
              - { name: body,        widget: text }

  # ─────────────────────────────────────────────────────
  - name: site
    label: "Site settings"
    files:
      - file: src/data/site.json
        label: "Contact, hours, brand"
        name: site
        fields:
          - { name: name,       label: "Business name",         widget: string }
          - { name: shortName,  label: "Short name",            widget: string }
          - { name: tagline,    label: "Tagline",               widget: string }
          - { name: url,        label: "Public URL",            widget: string }
          - { name: owner,      label: "Owner name",            widget: string }
          - { name: qualification,     label: "Qualification (short)",   widget: string }
          - { name: qualificationFull, label: "Qualification (long)",    widget: string }
          - name: address
            label: "Address"
            widget: object
            fields:
              - { name: street,    label: "Street",      widget: string }
              - { name: locality,  label: "Locality",    widget: string }
              - { name: region,    label: "Region",      widget: string }
              - { name: postcode,  label: "Postcode",    widget: string }
              - { name: country,   label: "Country",     widget: string, default: "GB" }
              - { name: lat,       label: "Latitude",    widget: number, value_type: float }
              - { name: lng,       label: "Longitude",   widget: number, value_type: float }
          - { name: phone,         label: "Phone (display)",          widget: string }
          - { name: phoneIntl,     label: "Phone (E.164, +44...)",    widget: string }
          - { name: whatsappIntl,  label: "WhatsApp (intl, no +)",    widget: string }
          - { name: email,         label: "Email",                    widget: string }
          - { name: facebook,      label: "Facebook URL",             widget: string, required: false }
          - { name: instagram,     label: "Instagram URL",            widget: string, required: false }
          - { name: priceRange,    label: "Price range (£/££/£££)",   widget: string }
          - name: hours
            label: "Opening hours"
            widget: list
            fields:
              - { name: day,   label: Day,   widget: string }
              - { name: open,  label: Open,  widget: string }
              - { name: close, label: Close, widget: string }
          - { name: hoursNote, label: "Hours note", widget: text }
          - name: serviceArea
            label: "Service area (towns/villages)"
            widget: list
          - name: trustPoints
            label: "Trust points (hero strip)"
            widget: list

  # ─────────────────────────────────────────────────────
  - name: services
    label: "Services (full grooming menu)"
    files:
      - file: src/data/services.json
        label: "All services"
        name: services
        fields:
          - name: services
            label: "Services"
            widget: list
            fields:
              - { name: slug,           label: Slug, widget: string }
              - { name: name,           label: "Service name", widget: string }
              - { name: summary,        label: "Summary (card text)", widget: text }
              - { name: fromPrice,      label: "From £ (number)", widget: number, value_type: int }
              - { name: duration,       label: Duration, widget: string }
              - name: tiers
                label: "Price tiers"
                widget: list
                fields:
                  - { name: label, widget: string }
                  - { name: from,  widget: number, value_type: int }
                  - { name: note,  widget: string, required: false }
              - name: includes
                label: "What's included"
                widget: list
              - { name: heroPhoto,        label: "Hero photo (filename, no extension)", widget: string, required: false }
              - { name: metaDescription,  label: "Meta description (SEO)", widget: text, required: false }
              - name: body
                label: "Body paragraphs"
                widget: list
                required: false
              - name: faqs
                label: "Service-specific FAQs"
                widget: list
                required: false
                fields:
                  - { name: q, widget: string }
                  - { name: a, widget: text }
              - name: relatedSlugs
                label: "Related service slugs"
                widget: list
                required: false
              - name: breedExamples
                label: "Breed examples (for /pricing/)"
                widget: list
                required: false
                fields:
                  - { name: size, label: "Tier label", widget: string }
                  - { name: from, label: "From £",    widget: number, value_type: int }
                  - name: breeds
                    label: "Breeds in this tier"
                    widget: list

  # ─────────────────────────────────────────────────────
  - name: areas
    label: "Areas covered"
    files:
      - file: src/data/areas.json
        label: "All areas"
        name: areas
        fields:
          - name: areas
            widget: list
            fields:
              - { name: slug,            widget: string }
              - { name: name,            widget: string }
              - { name: postcodePrefix,  widget: string }
              - { name: distanceMiles,   widget: number, value_type: float }
              - { name: driveMinutes,    widget: number, value_type: int }
              - name: landmarks
                widget: list
              - { name: blurb, widget: text }

  # ─────────────────────────────────────────────────────
  - name: faqs
    label: "FAQs"
    files:
      - file: src/data/faqs.json
        label: "All FAQs"
        name: faqs
        fields:
          - name: faqs
            widget: list
            fields:
              - { name: q, label: Question, widget: string }
              - { name: a, label: Answer,   widget: text }
              - name: tags
                label: "Tags (home, puppy, nervous, pricing, contact, trust, about, general)"
                widget: list

  # ─────────────────────────────────────────────────────
  - name: reviews
    label: "Reviews"
    files:
      - file: src/data/reviews.json
        label: "All reviews"
        name: reviews
        fields:
          - name: reviews
            label: "Reviews"
            widget: list
            summary: "{{fields.author}} — {{fields.dog}}"
            fields:
              - { name: author,    label: "Customer name",     widget: string,  hint: "e.g. Sarah M." }
              - { name: location,  label: "Where they live",   widget: string,  required: false, hint: "e.g. Newmillerdam" }
              - { name: dog,       label: "Dog's name + breed", widget: string, required: false, hint: "e.g. Bella (cockapoo)" }
              - { name: service,   label: "Service",           widget: select, required: false,
                  options: ["Full Groom","Puppy First Groom","Bath & Tidy","Nail Trim, Ear Clean & Tidy","De-matting & Coat Recovery","Hand Stripping"] }
              - { name: rating,    label: "Stars (1–5)",       widget: number,  min: 1, max: 5, value_type: int, default: 5 }
              - { name: date,      label: "Date",              widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
              - { name: body,      label: "Review",            widget: text,    hint: "What the customer said." }
              - { name: featured,  label: "Show on every page?", widget: boolean, default: false, hint: "Featured reviews appear in the strip under every page hero. Pick your 3 best." }
              - { name: id,        label: "Internal ID",       widget: string,  hint: "Any short unique id, e.g. r6" }

  # ─────────────────────────────────────────────────────
  - name: groom-stories
    label: "Groom Stories"
    files:
      - file: src/data/groom-stories.json
        label: "All groom stories"
        name: groom_stories
        fields:
          - name: stories
            label: "Groom stories"
            widget: list
            summary: "{{fields.dog}} — {{fields.service}}"
            fields:
              - { name: title,       label: "Story title",       widget: string,  hint: "Short, descriptive. e.g. 'Milo's coat recovery after a wet summer'" }
              - { name: description, label: "Story description", widget: text,    hint: "1–2 sentences shown under the title on cards and in the hero." }
              - { name: dog,         label: "Dog's name",        widget: string,  hint: "e.g. Milo" }
              - { name: breed,       label: "Breed & age",       widget: string,  hint: "e.g. Cockapoo, 3 years" }
              - { name: service,     label: "Service",           widget: select,
                  options: ["Full Groom","Puppy First Groom","Bath & Tidy","Nail Trim, Ear Clean & Tidy","De-matting & Coat Recovery","Hand Stripping","De-matting & Full Groom"] }
              - { name: area,        label: "Where they live",   widget: string,  hint: "e.g. Newmillerdam" }
              - { name: date,        label: "Date of groom",     widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
              - { name: summary,     label: "Short preview",     widget: text,    hint: "1–2 sentences shown on the card." }
              - { name: story,       label: "Full story",        widget: markdown, hint: "Write the story in paragraphs. Leave a blank line between paragraphs." }
              - { name: beforePhoto, label: "Before photo",      widget: string, required: false, hint: "Photo filename without extension (e.g. black-poodle-side). Upload photos in the Photos folder first." }
              - { name: afterPhoto,  label: "After photo",       widget: string, required: false, hint: "Same — filename without extension." }
              - { name: featured,    label: "Highlight on homepage?", widget: boolean, default: false }
              - { name: slug,        label: "URL ending",        widget: string,  hint: "Short, lower-case, hyphen-separated. e.g. milo-after-summer" }
